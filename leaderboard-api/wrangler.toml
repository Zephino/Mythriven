name = "mythriven-leaderboard"
workers_dev = true
main = "src/index.js"
compatibility_date = "2024-10-01"

# The setup script creates this and fills in the id:
#   npx wrangler kv namespace create LEADERBOARD_KV
# [[kv_namespaces]]
# binding = "LEADERBOARD_KV"
# id = "YOUR_KV_NAMESPACE_ID"

[vars]
GITHUB_OWNER = "Zephino"
GITHUB_REPO = "Mythriven"
GITHUB_PATH = "leaderboard.json"
GITHUB_BRANCH = "data"

# The GitHub key is a secret, never written here:
#   npx wrangler secret put GITHUB_TOKEN
