name = "mythriven"
workers_dev = true
main = "src/index.js"
compatibility_date = "2024-10-01"

# KV namespace created in Cloudflare and bound as LEADERBOARD_KV.
[[kv_namespaces]]
binding = "LEADERBOARD_KV"
id = "db73023753d249a8b47ac3231fc9cb80"

[vars]
GITHUB_OWNER = "Zephino"
GITHUB_REPO = "Mythriven"
GITHUB_PATH = "leaderboard.json"
GITHUB_BRANCH = "data"

# The GitHub key is a secret, never written here:
#   npx wrangler secret put GITHUB_TOKEN
