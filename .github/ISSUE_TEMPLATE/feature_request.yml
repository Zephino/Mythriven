name: "Suggest a feature"
description: "Tell us what you would love to see added to Mythriven."
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for playing Mythriven! Share a new hero, god, weapon, enemy, region, mechanic, or other idea.
        Suggestions are public GitHub issues. Please avoid sharing private information.
        A free GitHub account is required to post.
  - type: dropdown
    id: category
    attributes:
      label: What kind of suggestion is this?
      options:
        - Hero or playable character
        - God or summon
        - Weapon or ability
        - Enemy or boss
        - Region or level
        - Gameplay mechanic
        - Interface or quality of life
        - Other
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see added?
      description: Tell us about the feature in your own words.
      placeholder: "I would love to see..."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would it make Mythriven more fun?
      description: Optional, but it helps us understand the idea.
      placeholder: "It would be fun because..."
  - type: textarea
    id: details
    attributes:
      label: Additional details or examples
      description: Optional screenshots, links to public-domain mythology, or examples.
