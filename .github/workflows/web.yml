# Builds the playable web version on every push to main and publishes it to
# GitHub Pages: https://zephino.github.io/Mythriven/
# It's a debug build, so the F1 debug menu works. The automated tests (GUT)
# run first; their results are in the "Run automated tests" step's log, and a
# failing test doesn't stop the build from being published.
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and web export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$templates/"
          rm -f godot.zip templates.tpz
          echo "Installed web templates:"
          ls "$templates" | grep -i web

      - name: Import project
        run: godot --headless --import --path . || true

      - name: Run automated tests
        continue-on-error: true
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gconfig=.gutconfig.json

      - name: Test the leaderboard service
        continue-on-error: true
        working-directory: leaderboard-api
        run: node --test test/*.test.js

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --verbose --path . --export-debug "Web" build/web/index.html
          test -f build/web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
