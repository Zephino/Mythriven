# Builds the playable web version on every push to main and publishes it to
# GitHub Pages: https://zephino.github.io/Mythriven/
# It's a debug build, so the F1 debug menu works. The automated tests (GUT)
# run first; their results are in the "Run automated tests" step's log, and a
# failing test doesn't stop the build from being published.
#
# While GitHub Pages' source is "Deploy from a branch", GitHub also publishes
# the repository itself on every push (the holding page, index.html). So the
# deploy job waits for that to finish first and always publishes the game
# last, then checks the site really shows the game. Setting Pages' source to
# "GitHub Actions" (Settings → Pages) stops the extra publish altogether.
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and web export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$templates/"
          rm -f godot.zip templates.tpz
          echo "Installed web templates:"
          ls "$templates" | grep -i web

      - name: Import project
        run: godot --headless --import --path . || true

      - name: Run automated tests
        continue-on-error: true
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gconfig=.gutconfig.json

      - name: Test the leaderboard service
        continue-on-error: true
        working-directory: leaderboard-api
        run: node --test test/*.test.js

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --verbose --path . --export-debug "Web" build/web/index.html
          test -f build/web/index.html
          # Write the version into the page and add the updater (web/update.js), so
          # browsers always load matching files and switch to new versions by themselves.
          v=$(tr -d '[:space:]' < VERSION)
          cp web/update.js build/web/update.js
          sed -i "s/__MYTHRIVEN_VERSION__/$v/g; s|src=\"index.js\"|src=\"index.js?v=$v\"|" build/web/index.html
          grep -q "MYTHRIVEN_VERSION=\"$v\"" build/web/index.html
          grep -q "index.js?v=$v" build/web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false

      - name: Wait for GitHub's own Pages publish of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Up to 5 minutes; if there's none (source set to GitHub Actions), go ahead.
          for i in $(seq 1 30); do
            open=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$open" = "0" ]; then echo "No other Pages publish running."; exit 0; fi
            echo "Waiting for GitHub's Pages publish to finish ($i)…"
            sleep 10
          done
          echo "Still running after 5 minutes; publishing the game anyway."

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Check the site shows the game
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in $(seq 1 12); do
            if curl -sfL --max-time 20 "$url?check=$i" | grep -q "MYTHRIVEN_VERSION=\"$(tr -d '[:space:]' < VERSION)\""; then echo "Version $(cat VERSION) is live at $url"; exit 0; fi
            echo "Not the game yet ($i); waiting for GitHub's cache…"
            sleep 15
          done
          echo "::error::$url doesn't show the game. Re-run this workflow, or set Settings → Pages → Source to GitHub Actions."
          exit 1
