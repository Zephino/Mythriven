name: Feedback feature checks

on:
  pull_request:
    paths:
      - 'scripts/ui/suggestion_*.gd'
      - 'scripts/ui/hero_select.gd'
      - 'scripts/net/online_config.gd'
      - 'scripts/net/suggestion_environment.gd'
      - 'localization/text.csv'
      - 'leaderboard-api/**'
      - '.github/workflows/feedback-checks.yml'
  workflow_dispatch:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Worker API
        working-directory: leaderboard-api
        run: node --test test/*.test.js

  godot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and check for GDScript parser errors
        run: |
          godot --headless --import --path . 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR:|Failed to load script' godot-import.log; then
            echo "GDScript parsing failed (see errors above)"
            exit 1
          fi
